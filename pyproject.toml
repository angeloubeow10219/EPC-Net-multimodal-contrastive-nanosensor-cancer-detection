[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "epcnet"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1",
  "numpy==2.1.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "h5py==3.12.1",
]

[project.scripts]
epc-train = "epcnet.cli.train:main"
epc-evaluate = "epcnet.cli.evaluate:main"
epc-prepare = "epcnet.cli.prepare:main"

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true

